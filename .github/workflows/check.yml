name: Check CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ["*"]

jobs:
  check-clang-format:
    runs-on: ubuntu-26.04
    timeout-minutes: 10

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Print clang-format version
        run: clang-format --version

      - name: Check with clang-format
        run: git ls-files '*.cpp' '*.hpp' | xargs --no-run-if-empty clang-format --dry-run --Werror

  check-gersemi:
    runs-on: ubuntu-26.04
    timeout-minutes: 10

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Check with reuse
        shell: bash --noprofile --norc -euo pipefail -O nullglob {0}
        run: pipx run gersemi

  check-reuse:
    runs-on: ubuntu-26.04
    timeout-minutes: 10

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Check with reuse
        run: pipx run reuse lint
